<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kassenprogramm – DC Dartageddon / SV Netphen</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: #1a1a2e;
  color: #eee;
  min-height: 100vh;
  padding: 20px;
}
h1 { text-align: center; margin-bottom: 20px; color: #ffcc29; }
.tabs {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
  border-bottom: 2px solid #444;
  flex-wrap: wrap;
}
.tab-btn {
  padding: 12px 24px;
  background: #2d2d44;
  color: #ccc;
  border: none;
  border-radius: 8px 8px 0 0;
  cursor: pointer;
  font-size: 16px;
  font-weight: 600;
  transition: all 0.2s;
}
.tab-btn.active {
  background: #ffcc29;
  color: #1a1a2e;
}
.tab-btn:hover:not(.active) { background: #3d3d5c; }
.tab-content { display: none; }
.tab-content.active { display: block; }

.controls {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}
.controls input {
  flex: 1;
  min-width: 200px;
  padding: 12px;
  background: #2d2d44;
  border: 2px solid #444;
  color: #eee;
  border-radius: 8px;
  font-size: 16px;
}
.controls input:focus { outline: none; border-color: #ffcc29; }
.btn {
  padding: 12px 20px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-size: 15px;
  font-weight: 600;
  transition: all 0.2s;
}
.btn-primary { background: #ffcc29; color: #1a1a2e; }
.btn-primary:hover { background: #ffd94d; }
.btn-success { background: #2ecc71; color: white; }
.btn-success:hover { background: #27ae60; }
.btn-warning { background: #e67e22; color: white; }
.btn-warning:hover { background: #d35400; }
.btn-danger { background: #e74c3c; color: white; }
.btn-danger:hover { background: #c0392b; }
.btn-secondary { background: #34495e; color: white; }
.btn-secondary:hover { background: #2c3e50; }

.guest-list { display: grid; gap: 15px; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); }
.guest-card {
  background: #2d2d44;
  border: 2px solid #444;
  border-radius: 12px;
  padding: 15px;
  transition: border-color 0.2s;
}
.guest-card.highlight { border-color: #ffcc29; box-shadow: 0 0 20px rgba(255,204,41,0.3); }
.guest-card.paid { opacity: 0.7; border-color: #2ecc71; }
.guest-card.open-tab { border-color: #e67e22; }
.guest-name {
  font-size: 20px;
  font-weight: 700;
  color: #ffcc29;
  margin-bottom: 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.guest-name .total {
  color: #2ecc71;
  font-size: 18px;
}
.item-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 0;
  border-bottom: 1px solid #3d3d5c;
  gap: 8px;
}
.item-row:last-of-type { border-bottom: none; }
.item-label {
  flex: 1;
  font-size: 14px;
}
.item-label .price {
  color: #999;
  font-size: 12px;
  display: block;
}
.counter {
  display: flex;
  align-items: center;
  gap: 6px;
}
.counter button {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: none;
  background: #ffcc29;
  color: #1a1a2e;
  font-weight: bold;
  font-size: 18px;
  cursor: pointer;
}
.counter button:hover { background: #ffd94d; }
.counter button.minus { background: #e74c3c; color: white; }
.counter button.minus:hover { background: #c0392b; }
.counter .count {
  min-width: 30px;
  text-align: center;
  font-weight: bold;
  font-size: 16px;
}
.essen-input {
  width: 80px;
  padding: 6px;
  background: #1a1a2e;
  border: 1px solid #555;
  color: #eee;
  border-radius: 4px;
  text-align: right;
}
.card-actions {
  display: flex;
  gap: 8px;
  margin-top: 12px;
  flex-wrap: wrap;
}
.card-actions .btn { flex: 1; padding: 10px; font-size: 13px; }

.modal-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.7);
  z-index: 1000;
  justify-content: center;
  align-items: center;
  padding: 20px;
}
.modal-overlay.active { display: flex; }
.modal {
  background: #2d2d44;
  border-radius: 12px;
  padding: 25px;
  max-width: 500px;
  width: 100%;
  border: 2px solid #ffcc29;
}
.modal h3 { color: #ffcc29; margin-bottom: 15px; }
.modal p { margin-bottom: 20px; line-height: 1.5; }
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }

.earnings-summary {
  background: #2d2d44;
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 20px;
}
.earnings-block {
  padding: 15px;
  background: #1a1a2e;
  border-radius: 8px;
  margin-bottom: 15px;
  border-left: 4px solid #ffcc29;
}
.earnings-block h3 { color: #ffcc29; margin-bottom: 10px; }
.earnings-block .row {
  display: flex;
  justify-content: space-between;
  padding: 4px 0;
}
.earnings-block .total-row {
  font-weight: bold;
  font-size: 18px;
  border-top: 1px solid #444;
  margin-top: 8px;
  padding-top: 8px;
  color: #2ecc71;
}
.date-selector {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
  align-items: center;
  flex-wrap: wrap;
}
.date-selector select {
  padding: 10px;
  background: #2d2d44;
  border: 2px solid #444;
  color: #eee;
  border-radius: 8px;
  font-size: 15px;
  min-width: 200px;
}
.empty {
  text-align: center;
  padding: 40px;
  color: #777;
  font-style: italic;
}
.badge {
  display: inline-block;
  padding: 2px 8px;
  background: #ffcc29;
  color: #1a1a2e;
  border-radius: 12px;
  font-size: 12px;
  font-weight: bold;
  margin-left: 6px;
}
</style>
</head>
<body>

<h1>🍺 Kassenprogramm – DC Dartageddon / SV Netphen 🎯</h1>

<div class="tabs">
  <button class="tab-btn active" onclick="switchTab('aktuell')">Aktuell <span id="badgeAktuell" class="badge">0</span></button>
  <button class="tab-btn" onclick="switchTab('offen')">Offene Deckel <span id="badgeOffen" class="badge">0</span></button>
  <button class="tab-btn" onclick="switchTab('einnahmen')">Tageseinnahmen</button>
</div>

<!-- TAB: Aktuell -->
<div id="tab-aktuell" class="tab-content active">
  <div class="controls">
    <input type="text" id="searchInput" placeholder="Name suchen oder neu eintragen..." oninput="handleSearch()">
    <button class="btn btn-primary" onclick="addGuest()">➕ Gast hinzufügen</button>
    <button class="btn btn-danger" onclick="confirmClearAll()">🗑️ Alles löschen</button>
  </div>
  <div class="controls" style="background:#2d2d44; padding:12px; border-radius:8px; border:2px solid #e67e22;">
    <label style="align-self:center; color:#e67e22; font-weight:600;">🍽️ Essensbeitrag pro Portion (gilt für alle Gäste):</label>
    <input type="number" id="globalEssenPrice" step="0.10" min="0" placeholder="z.B. 5.00" style="max-width:150px;" oninput="setGlobalEssenPrice(this.value)">
    <span style="align-self:center; color:#ccc;">€</span>
  </div>
  <div id="guestList" class="guest-list"></div>
  <h2 style="margin: 30px 0 15px; color: #2ecc71;">✅ Bezahlt (heute)</h2>
  <div id="paidList" class="guest-list"></div>
</div>

<!-- TAB: Offene Deckel -->
<div id="tab-offen" class="tab-content">
  <div class="controls">
    <p style="color:#ccc;">Alle offenen Deckel – bleiben bis zur Bezahlung erhalten.</p>
  </div>
  <div id="openTabList" class="guest-list"></div>
</div>

<!-- TAB: Tageseinnahmen -->
<div id="tab-einnahmen" class="tab-content">
  <div class="date-selector">
    <label>Datum auswählen: </label>
    <select id="dateSelect" onchange="renderEarnings()"></select>
  </div>
  <div id="earningsContent"></div>
</div>

<!-- Modal -->
<div id="modal" class="modal-overlay">
  <div class="modal">
    <h3 id="modalTitle">Bestätigung</h3>
    <p id="modalText">Wirklich?</p>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">Nein / Abbrechen</button>
      <button class="btn btn-success" id="modalConfirm">Ja, bestätigen</button>
    </div>
  </div>
</div>

<script>
// ============ KONFIGURATION ============
const PRICES = {
  bier:     { label: "Bier / Softdrink", price: 2.00, kasse: "sv" },
  wasser:   { label: "Wasser / Kaffee",  price: 1.50, kasse: "sv" },
  longdrink:{ label: "Longdrink",        price: 4.50, kasse: "dc" },
  shots:    { label: "Shots",            price: 1.50, kasse: "dc" },
  essen:    { label: "Essen (variabel)", price: 0,    kasse: "dc", variable: true },
  spielgeld:{ label: "Spielgeld",        price: 2.00, kasse: "dc" }
};

// ============ STATE ============
let state = {
  active: [],      // { id, name, items:{bier:{count},...,essen:{count, price}} }
  paid: [],        // Tageszahlungen (temporär, für "Bezahlt heute"-Liste)
  openTabs: [],    // offene Deckel (persistent)
  earnings: {},    // { "2026-07-12": { entries: [ { name, items, total, sv, dc } ] } }
  globalEssenPrice: 0
};

function setGlobalEssenPrice(val) {
  const num = parseFloat(String(val).replace(",", "."));
  state.globalEssenPrice = isNaN(num) ? 0 : num;
  // Auf alle aktiven Gäste und offene Deckel übernehmen
  state.active.forEach(g => { g.items.essen.price = state.globalEssenPrice; });
  state.openTabs.forEach(g => { g.items.essen.price = state.globalEssenPrice; });
  save();
  renderGuests();
  renderOpenTabs();
}

// ============ PERSISTENZ ============
function save() {
  localStorage.setItem("kasse_state", JSON.stringify(state));
}
function load() {
  const s = localStorage.getItem("kasse_state");
  if (s) { try { state = JSON.parse(s); } catch(e){} }
  // heutige "paid" nur behalten wenn Datum stimmt
  const today = todayStr();
  if (state.paidDate && state.paidDate !== today) {
    state.paid = [];
  }
  state.paidDate = today;
}

function todayStr() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}

// ============ HELFER ============
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function makeEmptyItems() {
  const items = {};
  for (const k in PRICES) {
    items[k] = { count: 0 };
    if (PRICES[k].variable) items[k].price = state.globalEssenPrice || 0;
  }
  return items;
}

function calcTotals(guest) {
  let total = 0, sv = 0, dc = 0;
  for (const k in PRICES) {
    const conf = PRICES[k];
    const it = guest.items[k];
    if (!it || !it.count) continue;
    const unit = conf.variable ? (it.price || 0) : conf.price;
    const sum = unit * it.count;
    total += sum;
    if (conf.kasse === "sv") sv += sum;
    else dc += sum;
  }
  return { total, sv, dc };
}

function fmt(n) { return n.toFixed(2).replace(".", ",") + " €"; }

// ============ TAB-WECHSEL ============
function switchTab(name) {
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
  document.querySelectorAll(".tab-content").forEach(c => c.classList.remove("active"));
  event.target.classList.add("active");
  document.getElementById("tab-" + name).classList.add("active");
  if (name === "einnahmen") renderDateSelect();
  if (name === "offen") renderOpenTabs();
}

// ============ GAST HINZUFÜGEN ============
function addGuest() {
  const inp = document.getElementById("searchInput");
  const name = inp.value.trim();
  if (!name) { alert("Bitte Namen eingeben!"); return; }
  // Falls Gast bereits existiert (aktiv), nichts tun
  if (state.active.find(g => g.name.toLowerCase() === name.toLowerCase())) {
    alert("Gast '" + name + "' existiert bereits in der aktuellen Liste.");
    return;
  }
  state.active.push({ id: uid(), name, items: makeEmptyItems() });
  inp.value = "";
  save();
  renderGuests();
}

function handleSearch() {
  renderGuests();
}

// ============ COUNTER ============
function changeCount(id, key, delta) {
  const g = state.active.find(x => x.id === id);
  if (!g) return;
  g.items[key].count = Math.max(0, (g.items[key].count || 0) + delta);
  save();
  renderGuests();
}

function setEssenPrice(id, val) {
  const g = state.active.find(x => x.id === id);
  if (!g) return;
  const num = parseFloat(String(val).replace(",", "."));
  g.items.essen.price = isNaN(num) ? 0 : num;
  save();
  // Nur Totals aktualisieren, kein Full-Re-Render (damit Input-Fokus bleibt)
  updateTotal(id);
}

function updateTotal(id) {
  const g = state.active.find(x => x.id === id) || state.openTabs.find(x => x.id === id);
  if (!g) return;
  const t = calcTotals(g);
  const el = document.querySelector(`[data-total="${id}"]`);
  if (el) el.textContent = fmt(t.total);
}

// ============ RENDER: AKTUELLE GÄSTE ============
function renderGuests() {
  const list = document.getElementById("guestList");
  const search = document.getElementById("searchInput").value.trim().toLowerCase();
  const filtered = search
    ? state.active.filter(g => g.name.toLowerCase().includes(search))
    : state.active;

  document.getElementById("badgeAktuell").textContent = state.active.length;
  document.getElementById("badgeOffen").textContent = state.openTabs.length;

  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty">' + (state.active.length === 0 ? "Noch keine Gäste. Namen oben eingeben und hinzufügen." : "Keine Treffer für Suche.") + '</div>';
  } else {
    list.innerHTML = filtered.map(g => renderGuestCard(g, !!search)).join("");
  }

  // Bezahlt-heute Liste
  const paidList = document.getElementById("paidList");
  if (state.paid.length === 0) {
    paidList.innerHTML = '<div class="empty">Noch niemand hat heute bezahlt.</div>';
  } else {
    paidList.innerHTML = state.paid.map(p => `
      <div class="guest-card paid">
        <div class="guest-name">${escapeHtml(p.name)} <span class="total">${fmt(p.total)}</span></div>
        <div style="color:#999; font-size:13px;">Bezahlt um ${p.time}</div>
      </div>
    `).join("");
  }
}

function renderGuestCard(g, highlight) {
  const t = calcTotals(g);
  const rows = Object.keys(PRICES).map(k => {
    const conf = PRICES[k];
    const it = g.items[k];
    const priceLabel = conf.variable
      ? `${fmt(it.price || 0)} pro Portion <span style="color:#e67e22;">(global)</span>`
      : fmt(conf.price);
    return `
      <div class="item-row">
        <div class="item-label">${conf.label}<span class="price">${priceLabel}</span></div>
        <div class="counter">
          <button class="minus" onclick="changeCount('${g.id}','${k}',-1)">−</button>
          <span class="count">${it.count || 0}</span>
          <button onclick="changeCount('${g.id}','${k}',1)">+</button>
        </div>
      </div>
    `;
  }).join("");

  return `
    <div class="guest-card ${highlight ? "highlight" : ""}">
      <div class="guest-name">${escapeHtml(g.name)} <span class="total" data-total="${g.id}">${fmt(t.total)}</span></div>
      ${rows}
      <div class="card-actions">
        <button class="btn btn-success" onclick="askPay('${g.id}')">💰 Bezahlt</button>
        <button class="btn btn-warning" onclick="moveToOpenTab('${g.id}')">📋 Offener Deckel</button>
        <button class="btn btn-danger" onclick="askRemove('${g.id}')">✖</button>
      </div>
    </div>
  `;
}

function escapeHtml(s) { return String(s).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }
function escapeAttr(s) { return String(s).replace(/'/g, "\\'"); }

// ============ BEZAHLEN ============
function askPay(id) {
  const g = state.active.find(x => x.id === id) || state.openTabs.find(x => x.id === id);
  if (!g) return;
  const t = calcTotals(g);
  if (t.total <= 0) {
    if (!confirm("Betrag ist 0,00 €. Trotzdem als bezahlt markieren?")) return;
  }
  showModal("Bezahlung bestätigen",
    `Hat <b>${escapeHtml(g.name)}</b> wirklich <b>${fmt(t.total)}</b> bezahlt?`,
    () => confirmPay(id));
}

function confirmPay(id) {
  let g = state.active.find(x => x.id === id);
  let fromOpen = false;
  if (!g) {
    g = state.openTabs.find(x => x.id === id);
    fromOpen = true;
  }
  if (!g) return;
  const t = calcTotals(g);
  // In Tageseinnahmen speichern
  const today = todayStr();
  if (!state.earnings[today]) state.earnings[today] = { entries: [] };
  state.earnings[today].entries.push({
    name: g.name,
    items: JSON.parse(JSON.stringify(g.items)),
    total: t.total, sv: t.sv, dc: t.dc,
    time: new Date().toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" }),
    fromOpen
  });
  // In paid heute
  state.paid.push({ name: g.name, total: t.total, time: new Date().toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" }) });
  state.paidDate = today;
  // Aus aktiv oder openTabs entfernen
  if (fromOpen) state.openTabs = state.openTabs.filter(x => x.id !== id);
  else state.active = state.active.filter(x => x.id !== id);
  save();
  closeModal();
  renderGuests();
  renderOpenTabs();
}

// ============ OFFENER DECKEL ============
function moveToOpenTab(id) {
  const g = state.active.find(x => x.id === id);
  if (!g) return;
  state.openTabs.push(g);
  state.active = state.active.filter(x => x.id !== id);
  save();
  renderGuests();
  renderOpenTabs();
}

function renderOpenTabs() {
  const list = document.getElementById("openTabList");
  document.getElementById("badgeOffen").textContent = state.openTabs.length;
  if (state.openTabs.length === 0) {
    list.innerHTML = '<div class="empty">Keine offenen Deckel.</div>';
    return;
  }
  list.innerHTML = state.openTabs.map(g => {
    const t = calcTotals(g);
    const rows = Object.keys(PRICES).map(k => {
      const conf = PRICES[k];
      const it = g.items[k];
      if (!it.count) return "";
      const unit = conf.variable ? (it.price || 0) : conf.price;
      return `<div class="item-row"><div class="item-label">${conf.label}</div><div>${it.count} × ${fmt(unit)} = <b>${fmt(unit * it.count)}</b></div></div>`;
    }).join("");
    return `
      <div class="guest-card open-tab">
        <div class="guest-name">${escapeHtml(g.name)} <span class="total">${fmt(t.total)}</span></div>
        ${rows || '<div class="empty" style="padding:10px;">Keine Positionen</div>'}
        <div class="card-actions">
          <button class="btn btn-success" onclick="askPay('${g.id}')">💰 Bezahlt</button>
          <button class="btn btn-danger" onclick="askRemoveOpen('${g.id}')">✖ Löschen</button>
        </div>
      </div>
    `;
  }).join("");
}

// ============ GAST LÖSCHEN ============
function askRemove(id) {
  const g = state.active.find(x => x.id === id);
  if (!g) return;
  showModal("Gast löschen",
    `Wirklich <b>${escapeHtml(g.name)}</b> aus der aktuellen Liste entfernen? (ohne Bezahlung)`,
    () => {
      state.active = state.active.filter(x => x.id !== id);
      save(); closeModal(); renderGuests();
    });
}
function askRemoveOpen(id) {
  const g = state.openTabs.find(x => x.id === id);
  if (!g) return;
  showModal("Offenen Deckel löschen",
    `Wirklich <b>${escapeHtml(g.name)}</b> löschen? (ohne Bezahlung)`,
    () => {
      state.openTabs = state.openTabs.filter(x => x.id !== id);
      save(); closeModal(); renderOpenTabs();
    });
}

// ============ ALLES LÖSCHEN ============
function confirmClearAll() {
  showModal("Alles löschen",
    "Wirklich <b>ALLE aktuellen Gäste</b> und die <b>heute-bezahlt-Liste</b> löschen?<br><br>⚠️ Offene Deckel und Tageseinnahmen bleiben erhalten.",
    () => {
      state.active = [];
      state.paid = [];
      save(); closeModal(); renderGuests();
    });
}

// ============ TAGESEINNAHMEN ============
function renderDateSelect() {
  const sel = document.getElementById("dateSelect");
  const dates = Object.keys(state.earnings).sort().reverse();
  const today = todayStr();
  if (!dates.includes(today)) dates.unshift(today);
  sel.innerHTML = dates.map(d => `<option value="${d}">${formatDate(d)}${d === today ? " (heute)" : ""}</option>`).join("");
  renderEarnings();
}

function formatDate(iso) {
  const [y,m,d] = iso.split("-");
  return `${d}.${m}.${y}`;
}

function renderEarnings() {
  const sel = document.getElementById("dateSelect");
  const date = sel.value || todayStr();
  const day = state.earnings[date] || { entries: [] };
  const container = document.getElementById("earningsContent");

  let svTotal = 0, dcTotal = 0;
  const svBreakdown = { bier: 0, wasser: 0 };
  const dcBreakdown = { longdrink: 0, shots: 0, essen: 0, spielgeld: 0 };

  day.entries.forEach(e => {
    for (const k in PRICES) {
      const conf = PRICES[k];
      const it = e.items[k];
      if (!it || !it.count) continue;
      const unit = conf.variable ? (it.price || 0) : conf.price;
      const sum = unit * it.count;
      if (conf.kasse === "sv") svBreakdown[k] = (svBreakdown[k] || 0) + sum;
      else dcBreakdown[k] = (dcBreakdown[k] || 0) + sum;
    }
    svTotal += e.sv;
    dcTotal += e.dc;
  });

  const entriesHtml = day.entries.length === 0
    ? '<div class="empty">Für dieses Datum gibt es noch keine Einnahmen.</div>'
    : day.entries.map(e => `
        <div class="item-row" style="padding: 10px; background:#1a1a2e; margin-bottom:6px; border-radius:6px;">
          <div class="item-label"><b>${escapeHtml(e.name)}</b> <span style="color:#999;">um ${e.time}${e.fromOpen ? " (aus offenem Deckel)" : ""}</span></div>
          <div><b>${fmt(e.total)}</b> <span style="color:#999;">(SV: ${fmt(e.sv)} / DC: ${fmt(e.dc)})</span></div>
        </div>
      `).join("");

  container.innerHTML = `
    <div class="earnings-summary">
      <div class="earnings-block" style="border-left-color:#3498db;">
        <h3 style="color:#3498db;">🏟️ SV Netphen (Bier/Softdrink + Wasser/Kaffee)</h3>
        <div class="row"><span>Bier / Softdrink</span><b>${fmt(svBreakdown.bier || 0)}</b></div>
        <div class="row"><span>Wasser / Kaffee</span><b>${fmt(svBreakdown.wasser || 0)}</b></div>
        <div class="row total-row"><span>Summe SV Netphen</span><b>${fmt(svTotal)}</b></div>
      </div>
      <div class="earnings-block" style="border-left-color:#e74c3c;">
        <h3 style="color:#e74c3c;">🎯 DC Dartageddon (Longdrink + Shots + Essen + Spielgeld)</h3>
        <div class="row"><span>Longdrink</span><b>${fmt(dcBreakdown.longdrink || 0)}</b></div>
        <div class="row"><span>Shots</span><b>${fmt(dcBreakdown.shots || 0)}</b></div>
        <div class="row"><span>Essen</span><b>${fmt(dcBreakdown.essen || 0)}</b></div>
        <div class="row"><span>Spielgeld</span><b>${fmt(dcBreakdown.spielgeld || 0)}</b></div>
        <div class="row total-row"><span>Summe DC Dartageddon</span><b>${fmt(dcTotal)}</b></div>
      </div>
      <div class="earnings-block" style="border-left-color:#ffcc29;">
        <h3>💰 Gesamteinnahmen ${formatDate(date)}</h3>
        <div class="row total-row"><span>Total</span><b>${fmt(svTotal + dcTotal)}</b></div>
      </div>
    </div>
    <h3 style="margin-bottom:10px;">Einzelne Zahlungen (${day.entries.length})</h3>
    ${entriesHtml}
    ${day.entries.length > 0 ? `<button class="btn btn-danger" style="margin-top:15px;" onclick="askDeleteDay('${date}')">🗑️ Diesen Tag löschen</button>` : ""}
  `;
}

function askDeleteDay(date) {
  showModal("Tag löschen",
    `Wirklich <b>alle Einnahmen vom ${formatDate(date)}</b> löschen? Das kann nicht rückgängig gemacht werden!`,
    () => {
      delete state.earnings[date];
      save(); closeModal(); renderDateSelect();
    });
}

// ============ MODAL ============
let modalCallback = null;
function showModal(title, text, cb) {
  document.getElementById("modalTitle").textContent = title;
  document.getElementById("modalText").innerHTML = text;
  modalCallback = cb;
  document.getElementById("modal").classList.add("active");
}
function closeModal() {
  document.getElementById("modal").classList.remove("active");
  modalCallback = null;
}
document.getElementById("modalConfirm").addEventListener("click", () => {
  if (modalCallback) modalCallback();
});

// Enter im Suchfeld = Gast hinzufügen wenn kein Treffer
document.getElementById("searchInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    const name = e.target.value.trim();
    if (!name) return;
    const match = state.active.find(g => g.name.toLowerCase() === name.toLowerCase());
    if (!match) addGuest();
    else e.target.value = "";
    renderGuests();
  }
});

// ============ INIT ============
load();
if (typeof state.globalEssenPrice !== "number") state.globalEssenPrice = 0;
document.getElementById("globalEssenPrice").value = state.globalEssenPrice || "";
renderGuests();
</script>
</body>
</html>
